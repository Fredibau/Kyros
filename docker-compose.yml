
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kyros-db
    environment:
      POSTGRES_USER: kyros
      POSTGRES_PASSWORD: kyros
      POSTGRES_DB: kyros_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyros"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kyros-network

volumes:
  pgdata:

networks:
  kyros-network:
    driver: bridge
